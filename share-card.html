<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 0%, #1b2530 0%, #0d0f12 70%);
         color: #e9edf2; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; }

  h1 { font-size: 64px; margin: 0 0 12px; letter-spacing: -1px; }

  p { font-size: 28px; color: #9aa4b0; margin: 0 0 40px; }
  svg { width: 940px; height: auto; filter: drop-shadow(0 24px 40px rgba(0,0,0,.6)); }
</style></head>
<body>
  <img src="img/rewired-software.png" alt="">
